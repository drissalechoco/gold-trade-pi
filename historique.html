<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historique - Gold trade pi</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: #111; color: #fff; }
        header { background-color: #000; color: #d4af37; padding: 20px; text-align: center; border-bottom: 2px solid #d4af37; }
        .btn-back { background-color: transparent; color: #d4af37; border: 1px solid #d4af37; padding: 8px 15px; text-decoration: none; display: inline-block; margin: 20px; font-weight: bold; border-radius: 4px; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .history-card { background-color: #1a1a1a; border: 1px solid #222; border-radius: 8px; padding: 20px; margin-bottom: 15px; }
        .history-header { display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 10px; }
        .status-success { color: #2ecc71; font-weight: bold; }
        .item-details { display: flex; justify-content: space-between; font-size: 1.1rem; }
        .txid-text { font-family: monospace; color: #bdc3c7; font-size: 0.85rem; margin-top: 10px; background: #111; padding: 8px; border-radius: 4px; word-break: break-all; }
    </style>
</head>
<body>
    <header>
        <h1>HISTORIQUE - GOLD TRADE PI</h1>
        <p>Suivez vos transactions sur la Blockchain Pi</p>
    </header>
    <a href="index.html" class="btn-back">← Retour à la boutique</a>
    <div class="container">
        <div class="history-card">
            <div class="history-header"><span>Commande #GTP-8472</span><span class="status-success">Validé ✔</span></div>
            <div class="item-details"><span>Lingot d'Or Pur 24 Carats (10g)</span><span style="color:#d4af37; font-weight:bold;">25.00 Pi</span></div>
            <div class="txid-text"><strong>Blockchain TXID:</strong> pi_tx_gold_trade_pi_example_123456789</div>
        </div>
    </div>
</body>
</html>
